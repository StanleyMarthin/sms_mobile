# Tujuan: Konfigurasi dependensi dan environment project.
# Caller: Flutter SDK, Pub tool.
# Dependensi: Flutter, Berbagai package eksternal (Bloc, Dio, Firebase, etc.).
# Main Functions: N/A
# Side Effects: Mengunduh package saat pub get dijalankan.

name: sm_system
description: "SM System mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:

  flutter:
    sdk: flutter

  # UI & Core

  # State Management
  flutter_bloc: ^9.1.0

  # Dependency Injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.7.0
  http: ^1.2.2

  # Error Handling & Functional Programming
  fpdart: ^1.1.0

  # Routing
  go_router: ^14.7.2

  # JSON Serialization
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Utilities
  intl: ^0.19.0
  cryptography: ^2.7.0

  # Image Picker (camera & gallery) + In-App Camera
  image_picker: ^1.2.0
  camera: ^0.11.4
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.5.4

  # Device & Permissions
  android_id: ^0.4.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1
  flutter_ringtone_player: ^4.0.0+4
  wakelock_plus: ^1.6.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
