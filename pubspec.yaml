name: sm_system
description: "SM System mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:

  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.6

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4

  # Dependency Injection
  get_it: ^7.6.0

  # Networking
  dio: ^5.4.0
  http: ^1.2.1

  # Error Handling & Functional Programming
  fpdart: ^1.1.0

  # Routing
  go_router: ^13.2.4

  # JSON Serialization
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Utilities
  intl: ^0.19.0
  cryptography: ^2.7.0

  # Image Picker (camera & gallery) + In-App Camera
  image_picker: ^1.0.7
  camera: ^0.11.0
  flutter_image_compress: ^2.3.0
  shared_preferences: ^2.5.4

  # Device & Permissions
  android_id: ^0.4.0
  permission_handler: ^11.3.0
  geolocator: ^13.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1
  flutter_ringtone_player: ^4.0.0+4
  wakelock_plus: ^1.6.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
